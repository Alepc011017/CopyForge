name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux · test + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain estable + clippy
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: clippy
      # Deps de sistema para compilar crates con Iced/wgpu (winit necesita
      # xkbcommon + wayland; wgpu necesita Vulkan). En Windows no hace falta.
      - name: Install GUI deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Tests
        run: cargo test --workspace
      - name: Clippy estricto
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    name: Windows · tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain estable
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
      # Tests completos: aquí se verifica platform::atomic_replace
      # (ReplaceFileW/MoveFileExW) y el resto del motor en Windows.
      # Los tests que crean symlinks van con #[cfg_attr(windows, ignore)]
      # porque en Windows exigen privilegios ausentes en runners limpios
      # (compilan en ambos, solo se ejecutan en Unix).
      - name: Tests workspace
        run: cargo test --workspace
